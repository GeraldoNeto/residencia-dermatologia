# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Esta rotina faz uma chamada simples a cada 3 dias para ele continuar ativo.
name: Manter o banco ativo

on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Sinal de vida para o Supabase
        run: |
          curl --fail --silent --show-error -X POST \
            "https://gbpnpnxgadcsfyiktovl.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_Avd9sSBXI2KZBQ5vl65fgQ_UAmORKv7" \
            -H "Content-Type: application/json" -d '{}'
